<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Prihlásenie - Knižnica</title>
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
</head>
<body>
    <nav class="topbar">
        <a href="knihy.html">Knižnica (SQL)</a>
        <a href="login.html">Prihlásenie</a>
    </nav>
    <main class="card" style="max-width: 480px;">
        <h1>Prihlásenie</h1>
        <form id="formLogin" style="display: flex; flex-direction: column; gap: 14px;">
            <input type="text" id="meno" placeholder="Používateľské meno" required style="padding: 12px 16px; background: var(--bg); color: var(--text); border: 2px solid var(--border); border-radius: 10px;">
            <input type="password" id="heslo" placeholder="Heslo" required style="padding: 12px 16px; background: var(--bg); color: var(--text); border: 2px solid var(--border); border-radius: 10px;">
            <div style="display: flex; gap: 10px;">
                <button type="submit" style="flex: 1; padding: 12px; background: var(--accent); color: var(--on-accent); border: none; border-radius: 10px; font-weight: 700; cursor: pointer;">Prihlásiť sa</button>
                <button type="button" id="btnRegistracia" style="flex: 1; padding: 12px; background: transparent; color: var(--accent); border: 2px solid var(--accent); border-radius: 10px; font-weight: 700; cursor: pointer;">Registrovať sa</button>
            </div>
        </form>
        <p id="sprava" style="text-align: center; margin-top: 16px; font-weight: 600;"></p>
    </main>
</body>
</html>
